  <script>
    (function() {
      const originalError = console.error;
      const originalWarn = console.warn;
      const ignoredTerms = [
        "This script should only be loaded in a browser extension",
        "Error while trying to use the following icon from the Manifest",
        "Could not establish connection. Receiving end does not exist",
        "Refused to get unsafe header",
        "Permissions policy violation",
        "devicemotion events are blocked",
        "deviceorientation events are blocked",
        "Failed to load resource: net::ERR_BLOCKED_BY_CLIENT"
      ];

      function shouldIgnore(args) {
        try {
          const str = Array.from(args).map(arg => {
            if (typeof arg === 'string') return arg;
            if (arg instanceof Error) return arg.message + (arg.stack || '');
            return JSON.stringify(arg);
          }).join(' ');
          return ignoredTerms.some(term => str.includes(term));
        } catch (e) {
          return false;
        }
      }

      console.error = function(...args) {
        if (shouldIgnore(args)) return;
        originalError.apply(console, args);
      };

      console.warn = function(...args) {
        if (shouldIgnore(args)) return;
        originalWarn.apply(console, args);
      };

      window.addEventListener('unhandledrejection', function(event) {
        try {
          const reason = event.reason;
          const msg = reason && (reason.message || String(reason));
          if (msg && ignoredTerms.some(term => msg.includes(term))) {
            event.preventDefault();
          }
        } catch (e) {}
      });
    })();
  </script>
